services:
  grafana:
    image: grafana/grafana-oss:11.5.0
    container_name: monzphere-servicetree-grafana
    ports:
      - "3030:3000"
    volumes:
      - ./dist:/var/lib/grafana/plugins/monzphere-servicetree-panel:ro
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./data:/etc/grafana/data:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: monzphere-servicetree-panel
      GF_INSTALL_PLUGINS: marcusolsson-csv-datasource,alexanderzobnin-zabbix-app
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "true"
      GF_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  grafana-data:
